name: Build Gumdrop Gala APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"

jobs:
  # 1. Engine unit tests + random-play simulation (pure Kotlin, no Android needed)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Engine tests and simulations
        run: gradle :engine:test --no-daemon --stacktrace

  # 2. Native Android build
  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only used to attach APKs to a GitHub Release on tags
    env:
      VERSION_CODE: ${{ github.run_number }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }

      - name: Install SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect debug APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/GumdropGala-${VERSION_NAME}-debug.apk"

      - name: Build and sign release APK
        if: env.KS_B64 != ''
        run: |
          gradle :app:assembleRelease --no-daemon
          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "out/GumdropGala-${VERSION_NAME}-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "out/GumdropGala-${VERSION_NAME}-release.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: gumdrop-gala-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
